services:
  - type: web
    name: agrietech-backend
    runtime: node
    # Render Free tier sleeps after 15m inactivity. For 24/7 background queue processing and cron jobs, upgrade to 'starter'.
    plan: free
    region: frankfurt
    buildCommand: npm install && npx prisma generate
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health/liveness
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: APP_URL
        value: https://agrietech.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        # Allow web frontend domains and native apps (supports comma-separated list of domains)
        value: https://agrietech.onrender.com,https://agrietech-web.onrender.com,https://ethiofarm-admin.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
      - key: GEMINI_API_KEY_4
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: PLANT_ID_API_KEY
        sync: false
      - key: PLANTNET_API_KEY
        sync: false
      - key: PERENUAL_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REDIS_TLS
        value: "true"
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET_DIAGNOSES
        value: diagnose
      - key: SUPABASE_BUCKET_AUDIO
        value: audio
      - key: GEE_PROJECT_ID
        sync: false
      - key: GEE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: SMS_PROVIDER
        value: smsethiopia
      - key: SMS_ETHIOPIA_API_KEY
        sync: false
      - key: SMS_ETHIOPIA_BASE_URL
        value: https://smsethiopia.com/api
      - key: SMS_ETHIOPIA_SENDER_ID
        value: EthioFarm
      - key: ADMIN_API_KEYS
        sync: false
      - key: FRONTEND_URL
        value: https://agrietech-web.onrender.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: no-reply@agrietech.et
      - key: E2E_TEST_SECRET
        generateValue: true

